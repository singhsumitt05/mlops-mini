name: CI pipeline 
on: push
jobs:
  project-testing:
    runs-on: ubuntu-latest

    steps:
    
      - name: code checkout
        uses: actions/checkout@v3

      - name: setup python 
        uses: actions/setup-python@v2
        with: 
          python-versions: '3.12'

      - name: install dependencies
        run: |
          pip install -r requirements.txt

      - name: run pipeline 
        run: |
          dvc repro



